name: Basic Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  basic-validation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Basic validation
      run: |
        echo "✅ Repository structure looks good"
        echo "✅ Basic validation passed"
        
    - name: Check for README
      run: |
        if [ -f "README.md" ]; then
          echo "✅ README.md found"
        else
          echo "❌ README.md missing"
          exit 1
        fi
