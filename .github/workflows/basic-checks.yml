name: Basic Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  basic-validation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Basic validation
      run: |
        if [ -d ".github" ] && [ -d "src" ]; then
          echo "✅ Repository structure looks good"
        else
          echo "❌ Repository structure is invalid. Ensure '.github' and 'src' directories exist."
          exit 1
        fi
        
    - name: Check for README
      run: |
        if [ -f "README.md" ]; then
          echo "✅ README.md found"
        else
          echo "❌ README.md missing"
          exit 1
        fi
